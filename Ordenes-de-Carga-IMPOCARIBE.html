<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órdenes de Carga Impocaribe</title>
<style>
:root{
  --ink:#14202B; --ink-2:#4A5C6B; --ink-3:#7A8B99;
  --ground:#EFF3F6; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --line:#D3DDE5; --line-2:#E6ECF1;
  --accent:#1A3E96; --accent-soft:#E4EAF7; --accent-ink:#15327A;
  --mk-azul:#16368C; --mk-gris:#8A8A80;
  --ok:#1B7A4B; --ok-soft:#E2F2E9;
  --warn:#9A5B02; --warn-soft:#FBEFD9;
  --bad:#AE241C; --bad-soft:#FBE6E4;
  --shadow:0 1px 2px rgba(20,32,43,.08), 0 4px 12px rgba(20,32,43,.05);
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,"DejaVu Sans Mono",monospace;
  --doc:"Times New Roman",Times,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E3EBF2; --ink-2:#9CB0C0; --ink-3:#71879A;
    --ground:#0D141C; --surface:#151F2A; --surface-2:#1B2733;
    --line:#2B3A48; --line-2:#233140;
    --accent:#7B9DE8; --accent-soft:#16203A; --accent-ink:#A8C1F2;
    --mk-azul:#7B9DE8; --mk-gris:#A8A89C;
    --ok:#4FBB84; --ok-soft:#122A20;
    --warn:#D89B3C; --warn-soft:#2E2312;
    --bad:#E4746A; --bad-soft:#331716;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --mk-azul:#7B9DE8; --mk-gris:#A8A89C;
  --ink:#E3EBF2; --ink-2:#9CB0C0; --ink-3:#71879A;
  --ground:#0D141C; --surface:#151F2A; --surface-2:#1B2733;
  --line:#2B3A48; --line-2:#233140;
  --accent:#7B9DE8; --accent-soft:#16203A; --accent-ink:#A8C1F2;
    --mk-azul:#7B9DE8; --mk-gris:#A8A89C;
  --ok:#4FBB84; --ok-soft:#122A20;
  --warn:#D89B3C; --warn-soft:#2E2312;
  --bad:#E4746A; --bad-soft:#331716;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:16px 12px}
.brand{padding:4px 8px 16px;border-bottom:1px solid var(--line-2);margin-bottom:12px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--ink-2);cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:8px}
.offline{display:flex;align-items:center;gap:7px;color:var(--ok);font-weight:600}
.offline::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.themebtn{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--ink-2);cursor:pointer;font-size:11.5px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.user{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em}
.role{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.view{padding:22px 24px 48px;max-width:1180px}
.demo-note{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);color:var(--warn);border-radius:7px;padding:9px 13px;font-size:12.5px;margin-bottom:20px}
.demo-note b{color:var(--warn)}
/* ---------- pieces ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:22px}
.stat{background:var(--surface);padding:13px 15px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.stat .v{font-size:23px;font-weight:650;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .n{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.stat.alert .v{color:var(--bad)}
.stat.good .v{color:var(--ok)}

h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0 0 11px;font-weight:650}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:24px}
.panel-h{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:14px;font-weight:650}
.panel-h .muted{font-size:12px;color:var(--ink-3)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);font-size:12.5px}
.code{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em}
.nowrap{white-space:nowrap}
.who{font-size:12px;color:var(--ink-2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:11px;font-size:11px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent-ink)}
.pill.mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-2)}

.bar{position:relative;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:96px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent);display:block}
.bar i.full{background:var(--ok)}
.bar i.low{background:var(--warn)}
.barwrap{display:flex;align-items:center;gap:9px}
.barpct{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}

.btn{text-transform:none;letter-spacing:normal;display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.spacer{margin-left:auto}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:15px;padding:16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650}
input,select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;width:100%}
input:disabled,select:disabled{color:var(--ink-2)}
.auto{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent-ink);font-weight:600}
.hint{font-size:11px;color:var(--ink-3)}
.hint.auto-h{color:var(--accent)}
input.err{border-color:var(--bad);background:var(--bad-soft)}
.msg{display:flex;gap:8px;align-items:flex-start;padding:10px 13px;border-radius:7px;font-size:12.5px;margin:0 16px 14px}
.msg.bad{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.msg.ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.msg b{display:block;margin-bottom:1px}
/* saldo card */
.saldo{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line-2);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.saldo div{background:var(--surface-2);padding:11px 14px}
.saldo .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.saldo .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.saldo .v.bad{color:var(--bad)} .saldo .v.ok{color:var(--ok)} .saldo .v.warn{color:var(--warn)}

/* timeline cliente */
.steps{display:flex;flex-wrap:wrap;gap:0;padding:4px 0}
.step{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 0;font-size:12px;color:var(--ink-3)}
.step .mk{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:9px;flex:none;background:var(--surface)}
.step.done{color:var(--ink-2)} .step.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{color:var(--accent-ink);font-weight:650} .step.now .mk{border-color:var(--accent);background:var(--accent-soft)}
.step::after{content:"";width:15px;height:1px;background:var(--line);margin-left:6px}
.step:last-child::after{display:none}

/* documento impreso */
.paper-wrap{background:var(--surface-2);padding:22px;display:flex;justify-content:center;overflow-x:auto}
.paper{background:#fff;color:#000;width:660px;min-width:660px;padding:26px 30px;border:1px solid #000;font-family:var(--doc);font-size:12.5px;line-height:1.55}
.paper h4{text-align:center;font-size:14px;margin:0 0 16px;font-weight:700;text-decoration:none}
.paper .ln{border-bottom:1px solid #000;display:inline-block;min-width:120px}
.paper .row{display:flex;gap:18px;margin-bottom:9px;flex-wrap:wrap}
.paper .lbl{white-space:nowrap}
.paper table{width:100%;font-size:12px;border-collapse:collapse;margin:8px 0 4px;color:#000}
.paper table th{background:none;color:#000;font-family:var(--doc);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;text-decoration:underline;border:0;padding:3px 4px;text-align:left}
.paper table td{border:0;border-bottom:1px solid #000;padding:5px 4px;color:#000}
.paper .rule{border-top:1px solid #000;margin:9px 0}
.paper .small{font-size:11px;font-weight:700}
.paper .sig{display:flex;align-items:flex-end;gap:14px;margin-top:8px}
.stamp{width:88px;height:52px;border:2px solid #12457c;border-radius:50%/40%;display:grid;place-items:center;text-align:center;color:#12457c;font-size:7.5px;font-weight:700;line-height:1.15;transform:rotate(-6deg);letter-spacing:.02em}
.paper .anul{color:#AE241C;border:3px solid #AE241C;padding:3px 14px;font-weight:700;letter-spacing:.1em;transform:rotate(-11deg);display:inline-block;font-size:16px;position:absolute;top:120px;left:50%}
.paper-rel{position:relative}

/* versiones */
.vers{display:flex;flex-direction:column;gap:0}
.ver{display:flex;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line-2)}
.ver:last-child{border-bottom:0}
.ver .mk{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.ver.v-anul .mk{background:var(--bad)} .ver.v-ok .mk{background:var(--ok)} .ver.v-draft .mk{background:var(--warn)}
.ver .body{min-width:0;flex:1}
.ver .t{font-size:13px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ver .m{font-size:12px;color:var(--ink-3);margin-top:2px}
.ver .m em{font-style:normal;color:var(--ink-2)}

/* errores */
.errlist{display:flex;flex-direction:column}
.err-i{display:flex;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line-2)}
.err-i:last-child{border-bottom:0}
.err-n{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--bad);min-width:52px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.err-b{min-width:0}
.err-b b{display:block;font-size:13.5px;margin-bottom:2px}
.err-b p{margin:0;font-size:12.5px;color:var(--ink-2)}
.err-b .ev{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:5px;display:block}

/* login */
.login{max-width:352px;margin:44px auto;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);overflow:hidden}
.login-h{padding:22px 22px 4px;text-align:center}
.login-h b{font-size:16px;display:block}
.login-h span{font-size:12px;color:var(--ink-3)}
.users{display:flex;flex-direction:column;gap:1px;background:var(--line-2);margin-top:16px;border-top:1px solid var(--line-2)}
.users button{background:var(--surface);border:0;padding:12px 18px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:11px}
.users button:hover{background:var(--surface-2)}
.users .avatar{width:31px;height:31px;font-size:11.5px}
.users .nm{font-size:13.5px;font-weight:600}
.users .rl{font-size:11px;color:var(--ink-3)}

.btn.mini{padding:3px 9px;font-size:11.5px;border-radius:5px}

/* carga de cuño y firma */
.paper .sig img{max-height:44px;max-width:118px;object-fit:contain;vertical-align:bottom}

/* marca del cliente */
.logo-svg{display:block;height:auto}
.side .logo-svg{width:172px}
.marca .logo-svg{width:186px}
.paper .logo-svg{width:150px}
.marca{margin-left:auto;display:flex;align-items:center;gap:13px}
.marca .razon{text-align:right;line-height:1.25}
.marca .razon b{display:block;font-size:12.5px;font-weight:650}
.marca .razon span{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.sesion{display:flex;align-items:center;gap:8px;padding-top:2px}
.sesion .avatar{width:24px;height:24px;font-size:9.5px}
.sesion .s-n{font-size:11.5px;color:var(--ink-2);line-height:1.2}
.sesion .s-r{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.paper-logo{height:44px;width:auto}
.paper .logo-svg{--mk-azul:#16368C;--mk-gris:#8A8A80}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:10px}
  .brand{border:0;padding:0 10px 0 0;margin:0;flex:none}
  .brand span{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{white-space:nowrap;padding:7px 11px}
  .side-foot{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;align-items:center;flex:none}
  .view{padding:16px 14px 40px}
  .top{padding:12px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <b>Órdenes de Carga</b>
      <span>Impocaribe SURL</span>
    </div>
    <nav class="nav" id="nav">
      <button data-v="tablero" aria-current="true"><i class="dot"></i>Tablero</button>
      <button data-v="dm"><i class="dot"></i>Embarques (DM)</button>
      <button data-v="buscar"><i class="dot"></i>Buscar por DM</button>
      <button data-v="nueva"><i class="dot"></i>Nueva orden</button>
      <button data-v="editar"><i class="dot"></i>Editar orden</button>
      <button data-v="orden"><i class="dot"></i>Orden impresa</button>
      <button data-v="anular"><i class="dot"></i>Anular y reiniciar</button>
      <button data-v="errores"><i class="dot"></i>Errores detectados</button>
      <button data-v="acceso"><i class="dot"></i>Acceso y permisos</button>
    </nav>
    <div class="side-foot">
      <div class="sesion">
        <span class="avatar" id="ua">YG</span>
        <span><span class="s-n" id="un">Yahisa García Acosta</span><br><span class="s-r" id="ur">Apoderada</span></span>
      </div>
      <span class="offline">Funciona sin internet</span>
      <span>Datos en este equipo · copia en USB</span>
      <button class="themebtn" id="theme">Cambiar tema</button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div>
        <h1 id="vt">Tablero de extracción</h1>
        <div class="sub" id="vs">Puerto Habana · Terminal Haiphong</div>
      </div>
      <div class="marca">
        <div class="razon">
          <b>Agencia Importadora Caribe S.U.R.L.</b>
          <span>Miramar, Playa · La Habana</span>
        </div>
        <svg class="logo-svg" viewBox="0 0 340 78" role="img" aria-label="Impocaribe SURL" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(4,4)">
    <path d="M54 7 A32.5 32.5 0 1 0 54 63" fill="none" stroke="var(--mk-gris)" stroke-width="11" stroke-linecap="butt"/>
    <g fill="none" stroke="var(--mk-azul)" stroke-width="3.1">
      <circle cx="35" cy="35" r="22.5"/>
      <ellipse cx="35" cy="35" rx="9" ry="22.5"/>
      <ellipse cx="35" cy="35" rx="9" ry="22.5" transform="rotate(60 35 35)"/>
      <ellipse cx="35" cy="35" rx="9" ry="22.5" transform="rotate(120 35 35)"/>
      <line x1="12.5" y1="35" x2="57.5" y2="35"/>
    </g>
    <circle cx="35" cy="35" r="4.4" fill="var(--mk-azul)"/>
  </g>
  <text x="76" y="42" font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="2.4" fill="var(--mk-azul)">IMPOCARIBE</text>
  <text x="78" y="63" font-family="Segoe UI,system-ui,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="5.5" fill="var(--mk-gris)">SURL</text>
</svg>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

/* saldos calculados por el sistema */
function saldo(d){
  const tt = (d.tonTot===null||d.tonTot===undefined) ? null : d.tonTot;
  const bt = d.bbTot || 0;
  return {
    tonTot: tt, tonCar: d.tonCar||0,
    tonPend: tt===null ? null : +(tt-(d.tonCar||0)).toFixed(2),
    bbTot: bt, bbCar: d.bbCar||0,
    bbPend: bt===0 && (d.bbCar||0)>0 ? null : bt-(d.bbCar||0),
    faltaTotal: tt===null || (bt===0 && (d.bbCar||0)>0),
    pct: tt ? Math.min(100,Math.round((d.tonCar||0)/tt*100)) : (bt? Math.round((d.bbCar||0)/bt*100) : 0)
  };
}

function pasoCliente(pct, faltaTotal){
  if(faltaTotal) return 3;

}

function stepsHTML(pct, falta){
  const cur = pasoCliente(pct, falta);

    const n=i+1; const cls = n<cur?"done":(n===cur?"now":"");

    return `<span class="step ${cls}"><i class="mk">${n<cur?"✓":""}</i>${esc(txt)}</span>`;
  }).join("")+'</div>';
}

function initNueva(){
  const $=id=>document.getElementById(id);
  const sel=$("f-dm"), bb=$("f-bb"), ton=$("f-ton"), ch=$("f-chofer");
  function pinta(){
    const d = DMS.find(x=>x.dm===sel.value) || DMS[0];
    const s = d.s;
    $("f-cli").value=d.cliente; $("f-marca").value=d.marca;
    const o=ch.selectedOptions[0]; $("f-ci").value=o.dataset.ci; $("f-lic").value=o.dataset.lic;
    const nbb=+bb.value||0, nton=+ton.value||0;
    const restBB = s.bbPend===null?null:s.bbPend-nbb;
    const restT  = s.tonPend===null?null:+(s.tonPend-nton).toFixed(2);
    $("h-bb").textContent = s.bbPend===null? "Este DM no tiene total declarado" : "Quedan "+ent(s.bbPend)+" bigbags en el embarque";
    $("saldo-box").innerHTML = `
      <div><div class="k">Saldo del DM ${esc(d.dm)}</div><div class="v ${s.tonPend===null?'bad':''}">${s.tonPend===null?"sin total":fmt(s.tonPend)+" t"}</div></div>
      <div><div class="k">Esta orden</div><div class="v">${ent(nbb)} bb · ${fmt(nton)} t</div></div>
      <div><div class="k">Quedaría</div><div class="v ${restT===null?'bad':(restT<0?'bad':(restT===0?'ok':''))}">${restT===null?"—":fmt(restT)+" t"}</div></div>
      <div><div class="k">Bigbags restantes</div><div class="v ${restBB===null?'bad':(restBB<0?'bad':'')}">${restBB===null?"—":ent(restBB)}</div></div>`;
    const al=[]; let bloquea=false;
    if(s.faltaTotal){bloquea=true;al.push(`<div class="msg bad"><span>⛔</span><span><b>No se puede imprimir</b>El DM ${esc(d.dm)} no tiene el total del embarque registrado. Cárguelo primero en Embarques.</span></div>`);}
    if(restT!==null && restT<0){bloquea=true;al.push(`<div class="msg bad"><span>⛔</span><span><b>Sobregiro del embarque</b>Esta orden pasa el saldo por ${fmt(Math.abs(restT))} t. Quedan ${fmt(s.tonPend)} t en el DM ${esc(d.dm)}.</span></div>`);}
    if(restBB!==null && restBB<0){bloquea=true;al.push(`<div class="msg bad"><span>⛔</span><span><b>Bigbags insuficientes</b>Pide ${ent(nbb)} y solo quedan ${ent(s.bbPend)}.</span></div>`);}
    if(nbb>0 && nton>0 && nton/nbb>0.95){al.push(`<div class="msg bad"><span>⚠</span><span><b>Peso fuera de lo normal</b>${fmt(nton/nbb)} t por bigbag. En sus registros el promedio es 0,72 t. Revise el peso de patio.</span></div>`);}
    if(!bloquea && !al.length) al.push(`<div class="msg ok"><span>✓</span><span><b>Todo cuadra</b>La orden queda dentro del saldo del DM. Al imprimir pasa a oficial y el saldo se descuenta solo.</span></div>`);
    $("alertas").innerHTML=al.join("");
    ton.classList.toggle("err", restT!==null&&restT<0); bb.classList.toggle("err", restBB!==null&&restBB<0);
    $("btn-imp").disabled = bloquea || usuario.rol==="Solo lectura";
  }
  [sel,bb,ton,ch].forEach(el=>el.addEventListener("input",pinta));
  $("btn-imp").addEventListener("click",()=>ir("orden"));
  pinta();
}

function initBuscar(){

function fichaDM(d){

/* ============ CUÑO Y FIRMA (adjuntar sin pasos) ============ */
const SELLOS = {cuno:null, firma:null};

function conectarAdjuntos(refresca){
  const wire=(id,k)=>{
    const el=document.getElementById(id);
    if(!el) return;
    el.addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{ SELLOS[k]=ev.target.result; refresca(); };
      r.readAsDataURL(f);
    });
  };
  wire("up-firma","firma"); wire("up-cuno","cuno");
  wire("n-up-firma","firma"); wire("n-up-cuno","cuno");
  const q=document.getElementById("up-quitar");
  if(q) q.addEventListener("click",()=>{ SELLOS.firma=null; SELLOS.cuno=null; refresca(); });
  pintaEstado();
}
function pintaEstado(){
  const t = (SELLOS.firma||SELLOS.cuno)
    ? "Adjuntado: "+[SELLOS.firma?"firma":null, SELLOS.cuno?"cuño":null].filter(Boolean).join(" y ")
    : "Sin firma ni cuño · el documento se imprime en blanco para firmar a mano";
  ["up-est","n-up-est"].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent=t; });
}
